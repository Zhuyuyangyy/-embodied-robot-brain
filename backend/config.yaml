# EmbodiedRobotBrain Configuration

model:
  d_model: 768
  use_dinov2: false
  n_actions: 4
  action_std: 0.5

training:
  lr: 3.0e-4
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  n_epochs: 10
  batch_size: 64
  n_steps: 2048
  update_freq: 2048
  save_freq: 100
  log_freq: 10

rl:
  use_her: true
  her_strategy: "future"
  her_k: 4
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

env:
  n_objects: 3
  workspace_size: 0.4
  max_steps: 200
  domain_randomization: true

vision:
  image_size: 224
  patch_size: 16
  freeze_vit: false

output:
  output_dir: "outputs"
  log_dir: "runs"
